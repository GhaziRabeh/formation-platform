<!-- Sidebar -->
<aside class="w-64 min-h-screen bg-slate-900 text-white hidden md:flex flex-col">

  <div class="p-6 border-b border-slate-700">
    <h1 class="text-xl font-bold">Formation Platform</h1>
    <p class="text-xs text-slate-400 mt-1">{{ subtitle }}</p>
  </div>

  <nav class="p-4 space-y-2">

    <a *ngFor="let link of links"
      [routerLink]="link.route"
      routerLinkActive="bg-blue-600"
      class="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800">
      <lucide-icon [img]="link.icon" class="w-5 h-5 shrink-0"></lucide-icon>
      {{ link.label }}
    </a>

  </nav>

  <div class="mt-auto p-4 border-t border-slate-700">
    <button (click)="logout()" class="w-full flex items-center gap-3 text-left p-3 rounded-lg hover:bg-slate-800 text-slate-300">
      <lucide-icon [img]="LogOut" class="w-5 h-5 shrink-0"></lucide-icon>
      Déconnexion
    </button>
  </div>

</aside>
