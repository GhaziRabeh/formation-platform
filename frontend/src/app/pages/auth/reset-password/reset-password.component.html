
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-10">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="text-center mb-8">
      <div class="mx-auto w-16 h-16 flex items-center justify-center bg-blue-100 rounded-full mb-4">
        <span class="text-3xl">🔑</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Réinitialiser le mot de passe</h1>
      <p class="text-gray-500 mt-2">Entrez le code reçu et choisissez un nouveau mot de passe.</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="submit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Adresse email</label>
        <input type="email" formControlName="email"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Code OTP</label>
        <input type="text" maxlength="6" inputmode="numeric" formControlName="otp"
          placeholder="000000"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg text-center text-2xl tracking-[0.5em] font-bold outline-none focus:ring-2 focus:ring-blue-500">
        <p *ngIf="resetForm.controls.otp.touched && resetForm.controls.otp.invalid"
          class="text-red-500 text-sm mt-1">Le code doit contenir 6 chiffres.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Nouveau mot de passe</label>
        <input type="password" formControlName="new_password" placeholder="Minimum 8 caractères"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        <p *ngIf="resetForm.controls.new_password.touched && resetForm.controls.new_password.invalid"
          class="text-red-500 text-sm mt-1">8 caractères minimum.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Confirmer le mot de passe</label>
        <input type="password" formControlName="new_password_confirmation" placeholder="Confirmer le mot de passe"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <p *ngIf="errorMessage" class="text-red-600 text-sm">{{ errorMessage }}</p>

      <button type="submit" [disabled]="loading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg disabled:opacity-50">
        {{ loading ? 'Réinitialisation...' : 'Changer le mot de passe' }}
      </button>
    </form>

    <p class="text-center text-sm mt-6">
      <a routerLink="/login" class="text-blue-600 hover:underline">Retour à la connexion</a>
    </p>
  </div>
</div>
