
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Bienvenue</h1>
      <p class="text-gray-500 mt-2">Connectez-vous à votre espace</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-5">

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Adresse email
        </label>

        <input
          type="email"
          formControlName="email"
          placeholder="exemple@email.com"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
        >

        <p
          *ngIf="email?.touched && email?.invalid"
          class="text-red-500 text-sm mt-1"
        >
          <span *ngIf="email?.errors?.['required']">
            Email obligatoire.
          </span>
          <span *ngIf="email?.errors?.['email']">
            Adresse email invalide.
          </span>
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Mot de passe
        </label>

        <input
          type="password"
          formControlName="password"
          placeholder="Votre mot de passe"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
        >

        <p
          *ngIf="password?.touched && password?.invalid"
          class="text-red-500 text-sm mt-1"
        >
          Mot de passe obligatoire.
        </p>
      </div>

      <!-- Forgot password -->
      <div class="text-right">
        <a
          routerLink="/forgot-password"
          class="text-sm text-blue-600 hover:underline"
        >
          Mot de passe oublié ?
        </a>
      </div>

      <!-- Error -->
      <div
        *ngIf="errorMessage"
        class="bg-red-50 border border-red-200 text-red-600 text-sm p-3 rounded-lg"
      >
        {{ errorMessage }}

        <a
          *ngIf="emailNotVerified"
          routerLink="/verify-email"
          [queryParams]="{ email: email?.value }"
          class="block mt-2 font-semibold text-blue-600 hover:underline"
        >
          Vérifier mon email
        </a>
      </div>

      <!-- Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg disabled:opacity-50"
      >
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>

    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Vous n'avez pas de compte ?
      <a
        routerLink="/register"
        class="text-blue-600 font-semibold hover:underline"
      >
        Créer un compte
      </a>
    </p>

  </div>
</div>
