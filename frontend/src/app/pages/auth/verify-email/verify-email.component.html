
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="text-center mb-8">
      <div class="mx-auto w-16 h-16 flex items-center justify-center bg-blue-100 rounded-full mb-4">
        <span class="text-3xl">✉️</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Vérification email</h1>
      <p class="text-gray-500 mt-2">Saisissez le code à 6 chiffres envoyé à votre adresse email.</p>
    </div>

    <form [formGroup]="verifyForm" (ngSubmit)="submit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Adresse email</label>
        <input type="email" formControlName="email"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Code OTP</label>
        <input type="text" maxlength="6" inputmode="numeric" formControlName="otp"
          placeholder="000000"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg text-center text-2xl tracking-[0.5em] font-bold outline-none focus:ring-2 focus:ring-blue-500">
        <p *ngIf="verifyForm.controls.otp.touched && verifyForm.controls.otp.invalid"
          class="text-red-500 text-sm mt-1">Le code doit contenir exactement 6 chiffres.</p>
      </div>

      <p *ngIf="errorMessage" class="text-red-600 text-sm">{{ errorMessage }}</p>
      <p *ngIf="successMessage" class="text-green-600 text-sm">{{ successMessage }}</p>

      <button type="submit" [disabled]="loading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg disabled:opacity-50">
        {{ loading ? 'Vérification...' : 'Vérifier mon email' }}
      </button>
    </form>

    <div class="text-center mt-6">
      <button type="button" (click)="resendOtp()"
        class="text-blue-600 font-semibold hover:underline">
        Renvoyer le code OTP
      </button>
    </div>

    <p class="text-center text-sm mt-5">
      <a routerLink="/login" class="text-gray-500 hover:text-blue-600">Retour à la connexion</a>
    </p>
  </div>
</div>
