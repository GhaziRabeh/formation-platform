
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-10">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Créer un compte</h1>
      <p class="text-gray-500 mt-2">Rejoignez notre plateforme de formation</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="submit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Nom complet</label>
        <input type="text" formControlName="name" placeholder="Votre nom"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        <p *ngIf="registerForm.controls.name.touched && registerForm.controls.name.invalid"
          class="text-red-500 text-sm mt-1">Le nom est obligatoire (3 caractères minimum).</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Adresse email</label>
        <input type="email" formControlName="email" placeholder="exemple@email.com"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        <p *ngIf="registerForm.controls.email.touched && registerForm.controls.email.invalid"
          class="text-red-500 text-sm mt-1">Veuillez saisir une adresse email valide.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Je suis</label>
        <select formControlName="role"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white">
          <option value="participant">Participant</option>
          <option value="formateur">Formateur</option>
        </select>
        <p *ngIf="registerForm.controls.role.touched && registerForm.controls.role.invalid"
          class="text-red-500 text-sm mt-1">Veuillez choisir un rôle.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Mot de passe</label>
        <input type="password" formControlName="password" placeholder="Minimum 8 caractères"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        <p *ngIf="registerForm.controls.password.touched && registerForm.controls.password.invalid"
          class="text-red-500 text-sm mt-1">8 caractères minimum.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Confirmer le mot de passe</label>
        <input type="password" formControlName="password_confirmation" placeholder="Confirmer le mot de passe"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        <p *ngIf="registerForm.controls.password_confirmation.touched && registerForm.controls.password_confirmation.invalid"
          class="text-red-500 text-sm mt-1">Veuillez confirmer votre mot de passe.</p>
      </div>

      <p *ngIf="errorMessage" class="text-red-600 text-sm">{{ errorMessage }}</p>

      <button type="submit" [disabled]="loading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition disabled:opacity-50">
        {{ loading ? 'Création...' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Vous avez déjà un compte ?
      <a routerLink="/login" class="text-blue-600 font-semibold hover:underline">Se connecter</a>
    </p>
  </div>
</div>
