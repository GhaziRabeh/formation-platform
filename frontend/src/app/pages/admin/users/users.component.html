<div class="min-h-screen bg-slate-100 flex">

  <!-- Sidebar (shared) -->
  <app-sidebar role="admin"></app-sidebar>

  <!-- Main -->
  <main class="flex-1 min-w-0">

    <header class="bg-white border-b border-slate-200 px-6 py-4">
      <h2 class="text-xl font-bold text-slate-800">
        Liste des participants
      </h2>
      <p class="text-sm text-slate-500">
        {{ participants.length }} participant(s) inscrit(s) sur la plateforme
      </p>
    </header>

    <div class="p-6">

      <!-- Error -->
      <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-lg mb-5">

        {{ errorMessage }}

        <button (click)="loadParticipants()" class="ml-3 font-semibold underline">
          Réessayer
        </button>

      </div>

      <!-- Search -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 mb-5">

        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 flex text-slate-400 pointer-events-none"><lucide-icon [img]="Search" class="w-4 h-4"></lucide-icon></span>
          <input type="text" [(ngModel)]="search" placeholder="Rechercher par nom ou email..."
            class="w-full border border-slate-300 rounded-lg pl-10 pr-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

      </div>

      <!-- Loading -->
      <div *ngIf="loading" class="bg-white rounded-xl border p-10 text-center text-slate-500">
        Chargement des participants...
      </div>

      <!-- Table -->
      <div *ngIf="!loading" class="bg-white rounded-xl border border-slate-200 overflow-hidden">

        <div class="overflow-x-auto">

          <table class="w-full text-sm text-left">

            <thead class="bg-slate-50 text-slate-500">
              <tr>
                <th class="p-4">Nom</th>
                <th class="p-4">Email</th>
                <th class="p-4">Inscrit le</th>
              </tr>
            </thead>

            <tbody>

              <tr *ngFor="let participant of filteredParticipants" class="border-t border-slate-100 hover:bg-slate-50">

                <td class="p-4 font-semibold text-slate-800">
                  {{ participant.name }}
                </td>

                <td class="p-4 text-slate-600">
                  {{ participant.email }}
                </td>

                <td class="p-4 text-slate-600">
                  {{ participant.created_at | date:'dd/MM/yyyy' }}
                </td>

              </tr>

              <tr *ngIf="filteredParticipants.length === 0">

                <td colspan="3" class="p-8 text-center text-slate-500">
                  Aucun participant trouvé.
                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </main>

</div>
