<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1050" viewBox="0 0 1300 1050" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="1300" height="1050" fill="#ffffff"/>

  <!-- Title -->
  <text x="46" y="52" font-size="26" font-weight="700" fill="#1f2937">MCD avec héritage (admin, formateur, participant)</text>
  <text x="46" y="76" font-size="13" fill="#4b5563">Merise — spécialisation de UTILISATEUR — implémentation Laravel : tables users, ateliers, inscriptions</text>

  <!-- UTILISATEUR -->
  <rect x="160" y="110" width="360" height="160" rx="8" fill="#e8f1fb" stroke="#1d5fa8" stroke-width="1.5"/>
  <path d="M168 110 h344 a8 8 0 0 1 8 8 v30 h-360 v-30 a8 8 0 0 1 8 -8 z" fill="#1d5fa8"/>
  <text x="340" y="136" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">UTILISATEUR</text>
  <text x="182" y="176" font-size="14" font-weight="700" fill="#1f2937" text-decoration="underline">id</text>
  <text x="182" y="202" font-size="14" fill="#1f2937">name</text>
  <text x="182" y="228" font-size="14" fill="#1f2937">email</text>
  <text x="182" y="254" font-size="14" fill="#1f2937">password</text>

  <!-- Specialization -->
  <line x1="340" y1="270" x2="340" y2="292" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="340,292 324,318 356,318" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="366" y="312" font-size="13" font-style="italic" fill="#374151">{XT}</text>
  <line x1="340" y1="318" x2="340" y2="420" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="132" y1="420" x2="551" y2="420" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="132" y1="420" x2="132" y2="473" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="342" y1="420" x2="342" y2="473" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="551" y1="420" x2="551" y2="473" stroke="#1f2937" stroke-width="1.5"/>

  <!-- ADMIN -->
  <rect x="46" y="473" width="172" height="70" rx="6" fill="#efedfb" stroke="#5b4bc4" stroke-width="1.5"/>
  <path d="M52 473 h160 a6 6 0 0 1 6 6 v31 h-172 v-31 a6 6 0 0 1 6 -6 z" fill="#5b4bc4"/>
  <text x="132" y="498" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ADMIN</text>
  <text x="132" y="531" font-size="12" font-style="italic" fill="#4b5563" text-anchor="middle">hérite de UTILISATEUR</text>

  <!-- PARTICIPANT -->
  <rect x="256" y="473" width="172" height="70" rx="6" fill="#efedfb" stroke="#5b4bc4" stroke-width="1.5"/>
  <path d="M262 473 h160 a6 6 0 0 1 6 6 v31 h-172 v-31 a6 6 0 0 1 6 -6 z" fill="#5b4bc4"/>
  <text x="342" y="498" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">PARTICIPANT</text>
  <text x="342" y="531" font-size="12" font-style="italic" fill="#4b5563" text-anchor="middle">hérite de UTILISATEUR</text>

  <!-- FORMATEUR -->
  <rect x="465" y="473" width="172" height="70" rx="6" fill="#efedfb" stroke="#5b4bc4" stroke-width="1.5"/>
  <path d="M471 473 h160 a6 6 0 0 1 6 6 v31 h-172 v-31 a6 6 0 0 1 6 -6 z" fill="#5b4bc4"/>
  <text x="551" y="498" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">FORMATEUR</text>
  <text x="551" y="531" font-size="12" font-style="italic" fill="#4b5563" text-anchor="middle">hérite de UTILISATEUR</text>

  <!-- ATELIER -->
  <rect x="920" y="388" width="330" height="282" rx="8" fill="#e8f1fb" stroke="#1d5fa8" stroke-width="1.5"/>
  <path d="M928 388 h314 a8 8 0 0 1 8 8 v30 h-330 v-30 a8 8 0 0 1 8 -8 z" fill="#1d5fa8"/>
  <text x="1085" y="414" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ATELIER</text>
  <text x="942" y="452" font-size="14" font-weight="700" fill="#1f2937" text-decoration="underline">id</text>
  <text x="942" y="477" font-size="14" fill="#1f2937">title</text>
  <text x="942" y="502" font-size="14" fill="#1f2937">description</text>
  <text x="942" y="527" font-size="14" fill="#1f2937">lieu</text>
  <text x="942" y="552" font-size="14" fill="#1f2937">image</text>
  <text x="942" y="577" font-size="14" fill="#1f2937">date_debut</text>
  <text x="942" y="602" font-size="14" fill="#1f2937">date_fin</text>
  <text x="942" y="627" font-size="14" fill="#1f2937">capacite</text>
  <text x="942" y="652" font-size="14" fill="#1f2937">statut</text>

  <!-- ANIMER (association) -->
  <line x1="637" y1="508" x2="683" y2="508" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="840" y1="508" x2="920" y2="508" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="683" y="485" width="157" height="46" rx="23" fill="#e3f4ee" stroke="#0f6e57" stroke-width="1.5"/>
  <text x="761" y="514" font-size="15" font-weight="700" fill="#0f6e57" text-anchor="middle">ANIMER</text>
  <text x="643" y="498" font-size="14" font-weight="700" fill="#1f2937">0,N</text>
  <text x="890" y="498" font-size="14" font-weight="700" fill="#1f2937">1,1</text>

  <!-- INSCRIRE (association) -->
  <polyline points="342,543 342,650 652,650" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="870" y1="650" x2="920" y2="650" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="652" y="600" width="218" height="102" rx="10" fill="#e3f4ee" stroke="#0f6e57" stroke-width="1.5"/>
  <path d="M662 600 h198 a10 10 0 0 1 10 10 v26 h-218 v-26 a10 10 0 0 1 10 -10 z" fill="#0f6e57"/>
  <text x="761" y="624" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">INSCRIRE</text>
  <text x="674" y="660" font-size="14" fill="#1f2937">statut</text>
  <text x="674" y="685" font-size="14" fill="#1f2937">date_inscription</text>
  <text x="612" y="640" font-size="14" font-weight="700" fill="#1f2937">0,N</text>
  <text x="886" y="640" font-size="14" font-weight="700" fill="#1f2937">0,N</text>
  <text x="352" y="590" font-size="12" font-style="italic" fill="#c2410c">s'inscrit · annule la sienne (RG3)</text>

  <!-- Rights: FORMATEUR confirms / cancels inscriptions of his ateliers -->
  <polyline points="600,543 600,575 720,575 720,598" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="730" y="572" font-size="12" font-style="italic" fill="#c2410c">confirme · annule (RG4)</text>

  <!-- Rights: ADMIN confirms / cancels all inscriptions -->
  <polyline points="160,543 160,750 800,750 800,704" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="250" y="742" font-size="12" font-style="italic" fill="#c2410c">confirme · annule toutes les inscriptions (RG4)</text>

  <!-- Rights: ADMIN manages ateliers and assigns the formateur -->
  <polyline points="110,543 110,800 1085,800 1085,672" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="300" y="792" font-size="12" font-style="italic" fill="#c2410c">gère : crée · modifie · supprime l'atelier (RG1) — choisit son formateur, donc le lien ANIMER (RG2)</text>

  <!-- Legend and rules -->
  <rect x="46" y="830" width="1204" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="66" y="858" font-size="13" font-weight="700" fill="#1f2937">Légende</text>
  <line x1="140" y1="854" x2="180" y2="854" stroke="#1f2937" stroke-width="1.5"/>
  <text x="188" y="858" font-size="13" fill="#374151">association (lien enregistré en base)</text>
  <line x1="440" y1="854" x2="480" y2="854" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="490" y="858" font-size="13" fill="#374151">droit d'action (règle de gestion contrôlée par les policies Laravel, non enregistrée en base)</text>

  <text x="66" y="888" font-size="13" font-weight="700" fill="#1f2937">Règles de gestion</text>
  <text x="66" y="911" font-size="13" fill="#374151">RG1 — Seul l'ADMIN crée, modifie et supprime les ateliers.</text>
  <text x="66" y="933" font-size="13" fill="#374151">RG2 — L'ADMIN décide quel FORMATEUR anime chaque atelier (ANIMER) ; un atelier a exactement un formateur.</text>
  <text x="66" y="955" font-size="13" fill="#374151">RG3 — Un PARTICIPANT s'inscrit à un atelier planifié (statut en_attente), dans la limite de la capacité, et peut annuler sa propre inscription.</text>
  <text x="66" y="977" font-size="13" fill="#374151">RG4 — L'ADMIN, ou le FORMATEUR qui anime l'atelier, confirme ou annule les inscriptions de cet atelier.</text>
  <text x="66" y="999" font-size="13" fill="#374151">Domaines — ATELIER.statut ∈ { planifie, en_cours, termine, annule } · INSCRIRE.statut ∈ { en_attente, confirmee, annulee }</text>
  <text x="66" y="1021" font-size="13" fill="#374151">{XT} — un utilisateur a exactement un rôle (exclusion + totalité), implémenté par la colonne users.role.</text>
</svg>
